name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Proje dosyaları .github/workflows içinde (önceki çeviri projesindeki gibi).
      # settings.gradle.kts nerede olursa olsun otomatik bulunur.
      - name: Find project directory
        id: proj
        run: |
          F=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -n 1)
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # IPA, vurgu, hece, aynı okunan kelimeler ve ses karışıklıkları CMU Pronouncing Dictionary'den üretilir
      - name: Generate word list from the CMU Pronouncing Dictionary
        run: |
          DIR="${{ steps.proj.outputs.dir }}"
          pip install cmudict || true
          python3 "$DIR/tools/build_words.py" "$DIR/app/src/main/assets/words.json" "$DIR/words_report.txt"

      - name: Upload word report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: words-report
          path: ${{ steps.proj.outputs.dir }}/words_report.txt
          if-no-files-found: ignore

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telaffuz-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
